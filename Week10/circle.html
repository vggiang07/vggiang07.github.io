<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Circle</title>
<script>
    function calculate() {
    let r = parseFloat(document.getElementById("radius").value);

        if (isNaN(r)) {
            alert("Vui lòng nhập bán kính hợp lệ");
        return;
        }

    let pi = 3.14;
    let perimeter = 2 * pi * r;
    let area = pi * r * r;

        document.getElementById("result").innerHTML =
        "Chu vi: " + perimeter + "<br>Diện tích: " + area;
    }
</script>
</head>
<body>
    <h2>Hình tròn</h2>
    Bán kính: <input type="text" id="radius"><br><br>
    <button onclick="calculate()">Tính</button>

    <p id="result"></p>
</body>
</html>
