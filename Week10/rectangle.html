<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rectangle</title>
<script>
    function calculate() {
    let a = parseFloat(document.getElementById("length").value);
    let b = parseFloat(document.getElementById("width").value);

        if (isNaN(a) || isNaN(b)) {
            alert("Vui lòng nhập số hợp lệ");
        return;
        }

    let perimeter = 2 * (a + b);
    let area = a * b;

        document.getElementById("result").innerHTML =
            "Chu vi: " + perimeter + "<br>Diện tích: " + area;
    }
</script>
</head>
<body>
    <h2>Hình chữ nhật</h2>
    Dài: <input type="text" id="length"><br><br>
    Rộng: <input type="text" id="width"><br><br>
    <button onclick="calculate()">Tính</button>

    <p id="result"></p>
</body>
</html>
