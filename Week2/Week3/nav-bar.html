<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar</title>

    <style>
        /* ===== Thiết lập chung ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, serif;
            background-color: #ccc;
        }

        /* ===== Thanh điều hướng ===== */
        nav {
            background-color: #444;
            text-align: center;
            padding: 15px 0;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline-block;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 25px;
        }

        nav ul li a:hover {
            background-color: #666;
        }

        /* ===== Nội dung chính ===== */
        section {
            width: 900px;
            margin: 0 auto;
            background-color: #ccc;
            padding: 40px;
        }

        article {
            margin-bottom: 40px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .author {
            font-style: italic;
            color: gray;
            margin-bottom: 20px;
        }

        /* ===== Footer ===== */
        footer {
            background-color: #444;
            color: #fff;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
        }
    </style>

</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Tutorials</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Newsletter</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
 
</body>
</html>
